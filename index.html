<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sorteio dos cargos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="styles/index.css" />
  <link rel="stylesheet" href="styles/geral.css">
</head>

<body>
  <main>
    <h1>Sorteio dos Cargos</h1>

    <label for="cargos">Insira os cargos</label>
    <div class="form">
      <input type="text" name="cargos" id="cargos" />
      <button class="inserir botao" id="inserir-cargo">Inserir</button>
    </div>

    <div class="lista">
      <div class="itens"></div>
    </div>

    <div class="espacamento"></div>

    <button class="botao" id="confirmar">Confirmar Cargos</button>

    <div class="espacamento"></div>
  </main>

  <script type="module" src="scripts/index.js"></script>
</body>

</html>
